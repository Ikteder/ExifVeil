name: ExifVeil
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: NO
targets:
  ExifVeil:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Sources/ExifVeilCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikteder.exifveil
        PRODUCT_NAME: ExifVeil
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ExifVeil
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  ExifVeilTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/ExifVeilCoreTests
    dependencies:
      - target: ExifVeil
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikteder.exifveil.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  ExifVeil:
    build:
      targets:
        ExifVeil: all
        ExifVeilTests: [test]
    test:
      targets:
        - ExifVeilTests

