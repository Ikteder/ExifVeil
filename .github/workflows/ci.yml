name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node tests/static-check.mjs

  swift-and-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift package core
        run: swift test
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          echo "device_id=$device_id" >> "$GITHUB_OUTPUT"
      - name: Build and test iOS app
        run: >-
          xcodebuild
          -project ExifVeil.xcodeproj
          -scheme ExifVeil
          -sdk iphonesimulator
          -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.device_id }}'
          test
          CODE_SIGNING_ALLOWED=NO

