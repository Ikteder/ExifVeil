<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">ExifVeil local photo privacy pipeline</title>
  <desc id="desc">A five-stage flow selects one photo, inspects metadata, explains findings, sanitizes a new copy, validates it, and then permits explicit sharing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1200" height="520" rx="36" fill="url(#bg)"/>
  <text x="62" y="74" fill="#fff" font-family="system-ui, sans-serif" font-size="34" font-weight="700">ExifVeil</text>
  <text x="62" y="110" fill="#c7d2fe" font-family="system-ui, sans-serif" font-size="19">Local evidence before a photo leaves your device</text>

  <g filter="url(#shadow)" font-family="system-ui, sans-serif">
    <g transform="translate(60 166)">
      <rect width="190" height="210" rx="24" fill="#fff"/>
      <circle cx="95" cy="63" r="28" fill="#e0e7ff"/>
      <path d="M77 70l13-14 11 10 13-17 17 28H65z" fill="#4f46e5"/>
      <text x="95" y="122" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">1. Select</text>
      <text x="95" y="151" text-anchor="middle" font-size="15" fill="#4b5563">One system-picked</text>
      <text x="95" y="174" text-anchor="middle" font-size="15" fill="#4b5563">photo only</text>
    </g>
    <g transform="translate(280 166)">
      <rect width="190" height="210" rx="24" fill="#fff"/>
      <circle cx="95" cy="63" r="28" fill="#fef3c7"/>
      <path d="M80 49h30v28H80zm7 7h16m-16 7h16m-16 7h10" stroke="#d97706" stroke-width="4" fill="none" stroke-linecap="round"/>
      <text x="95" y="122" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">2. Inspect</text>
      <text x="95" y="151" text-anchor="middle" font-size="15" fill="#4b5563">GPS, time, device,</text>
      <text x="95" y="174" text-anchor="middle" font-size="15" fill="#4b5563">author, notes</text>
    </g>
    <g transform="translate(500 166)">
      <rect width="190" height="210" rx="24" fill="#fff"/>
      <circle cx="95" cy="63" r="28" fill="#fee2e2"/>
      <path d="M95 43l23 39H72zm0 14v11m0 7v2" stroke="#dc2626" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="95" y="122" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">3. Explain</text>
      <text x="95" y="151" text-anchor="middle" font-size="15" fill="#4b5563">Redacted evidence</text>
      <text x="95" y="174" text-anchor="middle" font-size="15" fill="#4b5563">and bounded signal</text>
    </g>
    <g transform="translate(720 166)">
      <rect width="190" height="210" rx="24" fill="#fff"/>
      <circle cx="95" cy="63" r="28" fill="#dcfce7"/>
      <path d="M79 64l10 10 22-24" stroke="#16a34a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="95" y="122" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">4. Sanitize</text>
      <text x="95" y="151" text-anchor="middle" font-size="15" fill="#4b5563">New oriented copy,</text>
      <text x="95" y="174" text-anchor="middle" font-size="15" fill="#4b5563">then re-inspect</text>
    </g>
    <g transform="translate(940 166)">
      <rect width="190" height="210" rx="24" fill="#fff"/>
      <circle cx="95" cy="63" r="28" fill="#dbeafe"/>
      <path d="M95 78V48m0 0L84 59m11-11l11 11M78 70v13h34V70" stroke="#2563eb" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="95" y="122" text-anchor="middle" font-size="21" font-weight="700" fill="#111827">5. Share</text>
      <text x="95" y="151" text-anchor="middle" font-size="15" fill="#4b5563">Only after explicit</text>
      <text x="95" y="174" text-anchor="middle" font-size="15" fill="#4b5563">user action</text>
    </g>
  </g>

  <g stroke="#a5b4fc" stroke-width="4" fill="none" stroke-linecap="round">
    <path d="M252 270h22"/><path d="M472 270h22"/><path d="M692 270h22"/><path d="M912 270h22"/>
  </g>
  <g fill="#a5b4fc">
    <path d="M274 270l-9-7v14z"/><path d="M494 270l-9-7v14z"/><path d="M714 270l-9-7v14z"/><path d="M934 270l-9-7v14z"/>
  </g>

  <rect x="60" y="420" width="1070" height="48" rx="16" fill="#1e1b4b" stroke="#6366f1"/>
  <text x="595" y="451" text-anchor="middle" fill="#e0e7ff" font-family="system-ui, sans-serif" font-size="17">No accounts  •  No network code  •  Original unchanged  •  Output must pass its own audit</text>
</svg>

